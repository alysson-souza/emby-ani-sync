name: CI

on:
  pull_request:
    branches: [emby]
  push:
    branches: [emby]
    tags: [v*]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npx prettier --check .

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Stage release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p artifact
          cp emby-ani-sync/bin/Release/netstandard2.0/emby-ani-sync.dll artifact/

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: emby-ani-sync
          path: artifact/emby-ani-sync.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: emby-ani-sync
          path: artifact

      - name: Zip release
        run: cd artifact && zip ../emby-ani-sync.zip emby-ani-sync.dll

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: emby-ani-sync.zip
          generate_release_notes: true
